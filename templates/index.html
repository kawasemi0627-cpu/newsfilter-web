<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ニュースフィルター</title>
</head>

<body>
    <h1>📌 ニュースフィルター</h1>
{% for category, articles in articles_by_category.items() %}
  <h2>{{ category }}</h2>
  <ul>
    {% for article in articles %}
      <li>
        <a href="{{ article.link }}" target="_blank">{{ article.title }}</a>
      </li>
    {% endfor %}
  </ul>
{% endfor %}</body>

</html>
